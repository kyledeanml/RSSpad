<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Yoga pad surface (shared with PythonPanel) -->
    <linearGradient id="yogaMatTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22436d" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#152943" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="yogaRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d578b" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#13253d" stop-opacity="0.58"/>
    </linearGradient>
    <!-- RSS tile & wave gradients -->
    <linearGradient id="rssTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1e4263" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="rssWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.80"/>
    </linearGradient>
  </defs>

  <!-- Unassuming Yoga Pad / Mat in Perspective (PythonPanel family base) -->
  <g transform="translate(26, 62) scale(1.28)">
    <path d="M 48 258 L 288 258 L 328 214 L 92 214 Z" fill="#060c17" fill-opacity="0.45"/>
    <path d="M 44 248 L 282 248 L 322 204 L 322 211 L 282 255 L 44 255 Z"
          fill="#1b3556" fill-opacity="0.65"
          stroke="#387eb8" stroke-width="1.2" stroke-opacity="0.55" stroke-linejoin="round"/>
    <path d="M 44 248 L 282 248 L 322 204 L 88 204 Z"
          fill="url(#yogaMatTop)"
          stroke="#387eb8" stroke-width="1.5" stroke-opacity="0.60" stroke-linejoin="round"/>
    <line x1="70" y1="226" x2="298" y2="226"
          stroke="#5ba4e5" stroke-width="1.1" stroke-opacity="0.38" stroke-dasharray="6,5"/>
    <line x1="176" y1="207" x2="152" y2="245"
          stroke="#5ba4e5" stroke-width="1.0" stroke-opacity="0.32"/>
    <path d="M 38 236 C 34 236 31 240 31 245 C 31 250 34 254 38 254 L 82 208 C 78 208 75 204 75 199 C 75 194 78 190 82 190 Z"
          fill="url(#yogaRoll)" stroke="#387eb8" stroke-width="1.3" stroke-opacity="0.62"/>
    <ellipse cx="40" cy="245" rx="7.5" ry="9.5"
             fill="#152943" fill-opacity="0.72"
             stroke="#4b91d1" stroke-width="1.3" stroke-opacity="0.65"/>
    <path d="M 40 241 C 42 241 43 243 43 245 C 43 247 41 249 39 249 C 37 249 36 246 37 244"
          fill="none" stroke="#63b3ed" stroke-width="1.1" stroke-opacity="0.60" stroke-linecap="round"/>
    <ellipse cx="182" cy="226" rx="60" ry="12" fill="#07111f" fill-opacity="0.55"/>
  </g>

  <!-- Translucent RSS Tile Resting on the Pad -->
  <g transform="translate(150, 92)">
    <rect x="0" y="0" width="212" height="212" rx="44" ry="44"
          fill="url(#rssTile)" stroke="#5ba4e5" stroke-width="2.2" stroke-opacity="0.65"/>
    <!-- subtle inner glow edge -->
    <rect x="8" y="8" width="196" height="196" rx="38" ry="38"
          fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.22"/>
    <!-- RSS dot -->
    <circle cx="62" cy="150" r="18" fill="url(#rssWave)"/>
    <!-- RSS waves -->
    <path d="M 44 96 A 72 72 0 0 1 116 168"
          fill="none" stroke="url(#rssWave)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 44 46 A 122 122 0 0 1 166 168"
          fill="none" stroke="url(#rssWave)" stroke-width="22" stroke-linecap="round"/>
    <!-- tiny music note accent -->
    <g transform="translate(150, 30)" fill="#bae6fd" fill-opacity="0.75">
      <rect x="14" y="0" width="4" height="30" rx="2"/>
      <path d="M 18 0 L 34 6 L 34 14 L 18 8 Z"/>
      <ellipse cx="10" cy="30" rx="9" ry="7"/>
    </g>
  </g>
</svg>
